{% include "django/forms/widgets/textarea.html" %}
{% with 'editor_'|add:widget.attrs.id as editorid %}
<div id="{{ editorid }}"></div>
<script type="text/javascript">
let {{ editorid }} = {}

  if (window.django_tuieditor) {
    {{ editorid }} = django_tuieditor.initEditor("#{{ widget.attrs.id }}", "#{{ editorid }}");
  } else {
    window.addEventListener("load", function () {
      {{ editorid }} = django_tuieditor.initEditor("#{{ widget.attrs.id }}", "#{{ editorid }}");
    });
  }
function get_editor_wr_content()
{
    return {{ editorid }}.getHtml();
}

function put_editor_wr_content(content)
{
    {{ editorid }}.setHtml(content);
    return;
}
</script>
{% endwith %}
