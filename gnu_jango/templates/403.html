<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>접근 권한 없음 | GnuJango</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f8fafc; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    section { width: min(520px, 100%); border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; padding: 32px; box-shadow: 0 16px 40px rgba(15, 23, 42, .08); }
    strong { color: #dc2626; font-size: 14px; letter-spacing: .08em; }
    h1 { margin: 10px 0 12px; font-size: 28px; line-height: 1.25; }
    p { margin: 0 0 22px; color: #4b5563; line-height: 1.7; }
    a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 6px; background: #111827; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section>
      <strong>403</strong>
      <h1>접근 권한이 없습니다.</h1>
      <p>로그인이 필요하거나 현재 계정에 권한이 없는 페이지입니다.</p>
      <a href="/login">로그인으로 이동</a>
    </section>
  </main>
</body>
</html>
