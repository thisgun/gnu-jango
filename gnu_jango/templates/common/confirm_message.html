{% extends 'common/common_base.html' %}
{% block content %}
{% comment %} {% load jsonify %} {% endcomment %}
<script>
{% comment %} var messages = {{ messages|jsonify }}; {% endcomment %}

{% autoescape off %}
var msg = "{{ msg }}".replaceAll("<br>", "\n");
{% endautoescape %}
var url2 = "{{ url2 }}";

if (confirm(msg)) {
    document.location.replace("{{ url1 }}");
} else if (url2) {
    document.location.replace(url2);
} else {
    window.close();
}

</script>

<noscript>
    <article id="confirm_check">
    <header>
        <hgroup>
            <h1>{{ site_title }}</h1> <!-- 수행 중이던 작업 내용 -->
            <h2>아래 내용을 확인해 주세요.</h2>
        </hgroup>
    </header>
    <p>
        {{ msg }}
    </p>
    
    <a href="{{ url1 }}">확인</a>
    <a href="{{ url2 }}">취소</a><br><br>
    <a href="{{ url3 }}">돌아가기</a>
    </article>
</noscript>

{% endblock %}
