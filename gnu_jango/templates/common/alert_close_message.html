{% extends 'common/common_base.html' %}
{% block content %}
{% comment %} {% load jsonify %} {% endcomment %}
<script>
{% comment %} var messages = {{ messages|jsonify }}; {% endcomment %}

var msg = "{{ msg }}";

{% comment %} if (messages.length) {
    alert(messages.join('\n'));
} else {
    alert();
} {% endcomment %}
alert(msg);

try {
    window.close();
} catch(error) {
    history.back();
}

setTimeout(function() {
    if (window.history.length) {
        window.history.back();
    }
}, 500);

</script>
{% endblock %}
