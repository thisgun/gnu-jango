{% load i18n static widgets %}
{% for nw in newwin_result %}
    {% pop_up_cookie 'hd_pops_' nw.pk as hd_pops_cookie %}
    {% if hd_pops_cookie %}
    {% else %}
    <div id="hd_pops_{{ nw.pk }}" class="hd_pops" style="top:{{ nw.nw_top }}px;left:{{ nw.nw_left }}px;z-index:10{{ forloop.counter0 }}">
        <div class="hd_pops_con" style="width:{{ nw.nw_width }}px;height:{{ nw.nw_height }}px">
            {% conv_content nw.nw_content 1 %}
        </div>
        <div class="hd_pops_footer">
            <button class="hd_pops_reject hd_pops_{{ nw.pk }} {{ nw.nw_disable_hours }}"><strong>{{ nw.nw_disable_hours }}</strong>시간 동안 다시 열람하지 않습니다.</button>
            <button class="hd_pops_close hd_pops_{{ nw.pk }}">닫기</button>
        </div>
    </div>
    {% endif %}
{% empty %}
    <span class="sound_only">팝업레이어 알림이 없습니다.</span>
{% endfor %}
<script>
    jQuery(function($) {
        $(".hd_pops_reject").click(function() {
            var id = $(this).attr('class').split(' ');
            var ck_name = id[1];
            var exp_time = parseInt(id[2]);
            $("#"+id[1]).css("display", "none");
            set_cookie(ck_name, 1, exp_time, gnu_cookie_domain);
        });
        $('.hd_pops_close').click(function() {
            var idb = $(this).attr('class').split(' ');
            $('#'+idb[1]).css('display','none');
        });
    });
</script>
