{% extends "admin/base_site.html" %}

{% block content %}
<section class="g5-admin-panel g5-admin-tool-panel">
  <h1>관리자 공지 알림 발송</h1>
  <p>수신자가 로그인하면 알림함에서 확인합니다. 한 번에 {{ max_recipients }}명까지 보낼 수 있습니다.</p>
  <p>개인정보와 비밀글 내용은 공지에 넣지 마세요. 발송한 공지는 각 수신자의 알림으로 저장됩니다.</p>
  <form method="post" class="g5-admin-admin-form">
    {% csrf_token %}
    <fieldset class="fieldset">
      <legend class="fieldset-legend">공지와 수신 대상</legend>
      {{ form.as_p }}
    </fieldset>
    <button type="submit" class="button btn btn-primary">공지 보내기</button>
  </form>
</section>
{% endblock %}
