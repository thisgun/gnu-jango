{% if page_obj.paginator.num_pages > 1 %}
<nav class="g5-admin-export-actions" aria-label="페이지">
  {% if page_obj.has_previous %}<a class="button btn g5-admin-button-secondary" href="{{ report_path }}?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">이전</a>{% endif %}
  <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 페이지 (전체 {{ page_obj.paginator.count }}건)</span>
  {% if page_obj.has_next %}<a class="button btn g5-admin-button-secondary" href="{{ report_path }}?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">다음</a>{% endif %}
</nav>
{% endif %}
