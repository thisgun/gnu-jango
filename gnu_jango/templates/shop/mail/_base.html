<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>{% block title %}{{ site_title }}{% endblock %}</title></head>
<body style="margin:0;padding:24px;background:#f5f5f4;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1c1917;">
<div style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;">
<div style="padding:20px 24px;border-bottom:1px solid #e7e5e4;">
<p style="margin:0;font-size:13px;color:#78716c;">{{ site_title }}</p>
<h1 style="margin:6px 0 0;font-size:20px;">{% block heading %}{% endblock %}</h1>
</div>
<div style="padding:20px 24px;font-size:14px;line-height:1.6;">
{% block content %}{% endblock %}
</div>
<div style="padding:14px 24px;border-top:1px solid #e7e5e4;font-size:12px;color:#a8a29e;">{{ site_title }}에서 보낸 메일입니다.</div>
</div>
</body>
</html>
