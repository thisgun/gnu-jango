{% extends theme_path|add:"base.html" %}
{% load static range getattribute widgets %}
{% block styles %}
<link rel="stylesheet" href="{% static board.board_skin_path|add:'style.css' %}" />
{{ media }}
{% endblock %}
{% block content %}

<form method="post" enctype="multipart/form-data" autocomplete="off">
  {% csrf_token %}
  {{ form.as_p }}
  {{ fileform.as_p }}
  <input type="submit" value="Submit" />
</form>

{% endblock %}
