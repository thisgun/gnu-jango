services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gnu_jango}
      POSTGRES_USER: ${DB_USERNAME:-gnu_jango}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gnu_jango_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gnu_jango} -d ${DB_NAME:-gnu_jango}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: example.settings.production
      ENVIRONMENT: Production
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see deploy/env/vps.env.example)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-gnu_jango}
      DB_USERNAME: ${DB_USERNAME:-gnu_jango}
      DB_PASSWORD: ${DB_PASSWORD:-gnu_jango_password}
      DB_HOSTNAME: db
      DB_PORT: 5432
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      SERVER_EMAIL: ${SERVER_EMAIL:-webmaster@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-WARNING}
      DJANGO_DB_LOG_LEVEL: ${DJANGO_DB_LOG_LEVEL:-WARNING}
      LOG_TO_FILE: ${LOG_TO_FILE:-False}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-True}
      # Deployment profile switches (docs/04-deploy/deployment-profiles.md). gunicorn runs several
      # workers, so the cache is shared through the redis service instead of per-process locmem.
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-vps}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      CRON_SECRET: ${CRON_SECRET:-}
      # Compose interpolation alone does not inject these variables into containers.
      # All web/worker/Beat services share this mapping so provider settings stay aligned.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_CUSTOM_DOMAIN: ${S3_CUSTOM_DOMAIN:-}
      S3_LOCATION: ${S3_LOCATION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_QUERYSTRING_EXPIRE: ${S3_QUERYSTRING_EXPIRE:-3600}
      G5_SMS_PROVIDER: ${G5_SMS_PROVIDER:-}
      G5_ICODE_TOKEN_KEY: ${G5_ICODE_TOKEN_KEY:-}
      G5_ICODE_JSON_SERVER: ${G5_ICODE_JSON_SERVER:-211.172.232.124}
      G5_ICODE_JSON_PORT: ${G5_ICODE_JSON_PORT:-9201}
      G5_ICODE_ID: ${G5_ICODE_ID:-}
      G5_ICODE_PASSWORD: ${G5_ICODE_PASSWORD:-}
      G5_ICODE_SERVER: ${G5_ICODE_SERVER:-}
      G5_ICODE_PORT: ${G5_ICODE_PORT:-7295}
      G5_SMS_RECIPIENT_HOURLY_LIMIT: ${G5_SMS_RECIPIENT_HOURLY_LIMIT:-5}
      G5_SMS_HOURLY_LIMIT: ${G5_SMS_HOURLY_LIMIT:-300}
      G5_SMS_BREAKER_SECONDS: ${G5_SMS_BREAKER_SECONDS:-300}
      SHOP_PAYMENT_CALLBACK_SECRET: ${SHOP_PAYMENT_CALLBACK_SECRET:-}
      SHOP_PAYMENT_CALLBACK_SIGNATURE_SECRET: ${SHOP_PAYMENT_CALLBACK_SIGNATURE_SECRET:-}
      SHOP_TOSS_CLIENT_KEY: ${SHOP_TOSS_CLIENT_KEY:-}
      SHOP_TOSS_SECRET_KEY: ${SHOP_TOSS_SECRET_KEY:-}
      SHOP_TOSS_API_BASE_URL: ${SHOP_TOSS_API_BASE_URL:-https://api.tosspayments.com}
      SHOP_TOSS_VBANK_ENABLED: ${SHOP_TOSS_VBANK_ENABLED:-False}
      SHOP_TOSS_ADMIN_KEYS_ENABLED: ${SHOP_TOSS_ADMIN_KEYS_ENABLED:-True}
      SHOP_PAYMENT_PROVIDER: ${SHOP_PAYMENT_PROVIDER:-}
      SHOP_PAYMENT_ADAPTER_BASE_URL: ${SHOP_PAYMENT_ADAPTER_BASE_URL:-}
      SHOP_PAYMENT_ADAPTER_SECRET: ${SHOP_PAYMENT_ADAPTER_SECRET:-}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    # A TCP probe: an HTTP request would depend on ALLOWED_HOSTS and SECURE_SSL_REDIRECT.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - media:/app/media

  worker:
    build: .
    command: celery -A example worker --loglevel=INFO --queues=celery,maintenance,communications,payments --concurrency=2 --max-tasks-per-child=200
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    volumes:
      - media:/app/media

  beat:
    extends:
      service: worker
    command: celery -A example beat --loglevel=INFO --schedule=/app/runtime/beat/celerybeat-schedule
    volumes:
      - beat_data:/app/runtime/beat

  media-worker:
    extends:
      service: worker
    command: celery -A example worker --loglevel=INFO --queues=media --concurrency=1 --max-tasks-per-child=50 --hostname=media@%h

  flower:
    profiles: ["monitoring"]
    extends:
      service: worker
    build:
      context: .
      args:
        INSTALL_MONITORING: "1"
    command: celery -A example flower --conf=/app/docker/flowerconfig.py
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    volumes:
      - flower_data:/app/runtime/flower

  notification-worker:
    profiles: ["realtime"]
    extends:
      service: worker
    command: python manage.py process_notifications --apply --watch
    restart: unless-stopped

volumes:
  postgres_data:
  media:
  redis_data:
  beat_data:
  flower_data:
