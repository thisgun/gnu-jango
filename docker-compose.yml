services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gnu_jango}
      POSTGRES_USER: ${DB_USERNAME:-gnu_jango}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gnu_jango_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gnu_jango} -d ${DB_NAME:-gnu_jango}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: example.settings.production
      ENVIRONMENT: Production
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see deploy/env/vps.env.example)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-gnu_jango}
      DB_USERNAME: ${DB_USERNAME:-gnu_jango}
      DB_PASSWORD: ${DB_PASSWORD:-gnu_jango_password}
      DB_HOSTNAME: db
      DB_PORT: 5432
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      SERVER_EMAIL: ${SERVER_EMAIL:-webmaster@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-WARNING}
      DJANGO_DB_LOG_LEVEL: ${DJANGO_DB_LOG_LEVEL:-WARNING}
      LOG_TO_FILE: ${LOG_TO_FILE:-False}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      # Deployment profile switches (docs/04-deploy/deployment-profiles.md). gunicorn runs several
      # workers, so the cache is shared through the redis service instead of per-process locmem.
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-vps}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    # A TCP probe: an HTTP request would depend on ALLOWED_HOSTS and SECURE_SSL_REDIRECT.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - media:/app/media

  worker:
    build: .
    command: celery -A example worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUN_MIGRATIONS: "0"
      DJANGO_SETTINGS_MODULE: example.settings.production
      ENVIRONMENT: Production
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see deploy/env/vps.env.example)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-gnu_jango}
      DB_USERNAME: ${DB_USERNAME:-gnu_jango}
      DB_PASSWORD: ${DB_PASSWORD:-gnu_jango_password}
      DB_HOSTNAME: db
      DB_PORT: 5432
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      SERVER_EMAIL: ${SERVER_EMAIL:-webmaster@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-WARNING}
      DJANGO_DB_LOG_LEVEL: ${DJANGO_DB_LOG_LEVEL:-WARNING}
      LOG_TO_FILE: ${LOG_TO_FILE:-False}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
    volumes:
      - media:/app/media

  notification-worker:
    profiles: ["realtime"]
    extends:
      service: worker
    command: python manage.py process_notifications --apply --watch
    restart: unless-stopped

volumes:
  postgres_data:
  media:
