name: CD

# Runs only in the public repository (a private copy of the code never builds or deploys).
#  - main: after CI passes, publish the Docker image ghcr.io/<owner>/<repo>:main and :sha-<short>.
#  - tags v*: publish :<version> and :latest and create a GitHub Release.
#  - Vercel: optional; deploys the Django (Vercel + Supabase) profile when the repository variable
#    VERCEL_DEPLOY is "true" and the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: >-
      ${{ !github.event.repository.private &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: ${{ !github.event.repository.private && startsWith(github.ref, 'refs/tags/v') }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"

  vercel:
    if: >-
      ${{ !github.event.repository.private &&
          (vars.VERCEL_DEPLOY == 'true' || vars.RUN_DB_MIGRATIONS == 'true' || vars.VERCEL_DEPLOY_HOOK == 'true') &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Check the Vercel secrets
        if: vars.VERCEL_DEPLOY == 'true'
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; exit 1; fi
          done
      - name: Set up Python for database migrations
        if: vars.RUN_DB_MIGRATIONS == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply production database migrations
        if: vars.RUN_DB_MIGRATIONS == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: example.settings.development
          ENVIRONMENT: Development
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set"
            exit 1
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py migrate --plan
          python manage.py migrate --noinput
      - name: Apply handbook database migrations
        if: vars.RUN_DB_MIGRATIONS == 'true'
        env:
          DATABASE_URL: ${{ secrets.HANDBOOK_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: example.settings.development
          ENVIRONMENT: Development
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "handbook migrations skipped: HANDBOOK_DATABASE_URL is not set"
            exit 0
          fi
          python manage.py migrate --plan
          python manage.py migrate --noinput
      - name: Trigger Vercel production deploys
        if: vars.VERCEL_DEPLOY_HOOK == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_HANDBOOK_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_HANDBOOK_DEPLOY_HOOK_URL }}
        run: |
          for name in VERCEL_DEPLOY_HOOK_URL VERCEL_HANDBOOK_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set"
              exit 1
            fi
          done
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_HANDBOOK_DEPLOY_HOOK_URL"
      - name: Deploy to Vercel (production)
        if: vars.VERCEL_DEPLOY == 'true'
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
