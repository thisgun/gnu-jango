name: CodeQL

# Static security analysis (GitHub code scanning). Free for public repositories, so it runs only
# there; a private copy of the code skips it. Results appear under Security -> Code scanning.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Build output of the Next.js theme and vendored minified libraries are not our source.
          config: |
            paths-ignore:
              - gnu_jango/templates/theme
              - gnu_jango/templates/theme_static
              - gnu_jango/templates/statics/editor/tuieditor
              - "**/*.min.js"
              - "**/migrations"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
