name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  django:
    # CI runs in the public repository only; a private copy of the code skips it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    services:
      notification-redis:
        image: redis:7-alpine
        ports:
          - "6399:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gnu_jango_ci
          POSTGRES_USER: gnu_jango
          POSTGRES_PASSWORD: gnu_jango_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U gnu_jango -d gnu_jango_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: example.settings
      NOTIFICATION_TEST_REDIS_URL: redis://127.0.0.1:6399/2
      SECRET_KEY: ci-secret-key
      ENVIRONMENT: Development
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: gnu_jango_ci
      DB_USERNAME: gnu_jango
      DB_PASSWORD: gnu_jango_password
      DB_HOSTNAME: localhost
      DB_PORT: 5432
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Python quality smoke
        # F601 catches duplicate dict keys (one silently overwrote a computed
        # editor flag), F811 redefinitions, E722 bare excepts.
        run: ruff check gnu_jango example --select E9,F63,F7,F82,F601,F811,E722
      - name: Django checks
        run: python manage.py check
      - name: OpenAPI schema is up to date
        # openapi/schema.json is the API contract the Next.js types are generated from. After
        # changing an annotated view or gnu_jango/api/contracts/, regenerate it with the same
        # command (writing to openapi/schema.json) and run `npm run api:types` in nextjs/.
        run: |
          python manage.py spectacular --format openapi-json --file "$RUNNER_TEMP/openapi.json"
          diff -u openapi/schema.json "$RUNNER_TEMP/openapi.json"
      - name: Django tests
        # The whole suite under pytest (pytest-django): Django TestCase classes and function-style
        # tests that use conftest.py fixtures and gnu_jango/testing/factories.py. -n auto runs
        # worker processes (pytest-xdist); pytest-cov merges their coverage and fails the job below
        # [tool.coverage.report] fail_under in pyproject.toml.
        run: pytest -n auto --cov=gnu_jango --cov-report=term

  nextjs:
    # CI runs in the public repository only; a private copy of the code skips it.
    if: ${{ !github.event.repository.private }}
    # Keep the browser job on a platform supported by the pinned Playwright release.
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_MODE: g5-jwt
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Validate the production environment template
        run: npm run check:vercel-env:template
      - name: API types match the OpenAPI schema
        run: npm run check:api-types
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Payment return tests
        run: npm run test:payment:return
      - name: Install browser for notification recovery tests
        run: npx playwright install --with-deps chromium
      - name: Notification recovery tests
        run: npm run test:notifications

  e2e:
    # Browser E2E of the shop order flow (nextjs/tests/e2e-checkout.spec.ts) against a real Django
    # server. Django serves the committed theme export (gnu_jango/templates/theme*/), so no Next
    # build or dev server is needed. CI runs in the public repository only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: example.settings
      # development settings: DEBUG on, the theme pages and /_next/static served by core.views
      ENVIRONMENT: Development
      SECRET_KEY: ci-e2e-secret-key
      ALLOWED_HOSTS: 127.0.0.1,localhost
      # a throwaway SQLite file in the checkout, created by migrate below
      DATABASE_URL: sqlite:///e2e-ci.sqlite3
      CELERY_TASK_ALWAYS_EAGER: "True"
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_MEMBER_ID: e2e_buyer
      E2E_MEMBER_PASSWORD: e2e-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Prepare the disposable shop database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_shop --i-know-this-is-disposable
      - name: Start Django
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/status && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/django.log"
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install Node dependencies
        working-directory: nextjs
        run: npm ci
      - name: Install browser
        working-directory: nextjs
        run: npx playwright install --with-deps chromium
      - name: Checkout E2E
        working-directory: nextjs
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e:checkout -- --reporter=list,html
      - name: Django log
        if: failure()
        run: cat "$RUNNER_TEMP/django.log" || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-checkout-report
          path: |
            nextjs/playwright-report/
            nextjs/test-results/
          retention-days: 7

  theme-bundles:
    # Next/Turbopack emits platform-specific static export filenames. Compare the committed Django
    # bundles on Windows, the same platform used to generate them, instead of reporting Linux drift.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    env:
      DJANGO_SETTINGS_MODULE: example.settings
      ENVIRONMENT: Development
      DEBUG: "False"
      SECRET_KEY: ci-nextjs-static-build-key
      ALLOWED_HOSTS: 127.0.0.1,localhost
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      G5_API_INTERNAL_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_G5_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_MODE: g5-jwt
      NEXT_PUBLIC_GALLERY_BOARDS: n_gallery,gallery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare local API database
        run: python manage.py migrate --noinput
      - name: Prepare deterministic handbook sample data
        run: python manage.py ensure_handbook_samples --stable-dates
      - name: Start local API for the static theme build
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'gnu-jango-static-api.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'gnu-jango-static-api.stderr.log'
          Start-Process -FilePath python `
            -ArgumentList @('manage.py', 'runserver', '127.0.0.1:8000', '--noreload') `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr | Out-Null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/api/v1/status' -TimeoutSec 4
              if ($response.StatusCode -eq 200) { exit 0 }
            } catch { }
            Start-Sleep -Seconds 2
          }
          Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
          throw 'The local Django API did not become ready for the static theme build.'
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install Node dependencies
        working-directory: nextjs
        run: npm ci
      - name: Build and verify the Django default theme bundle
        working-directory: nextjs
        run: |
          npm run build:theme
          npm run build -- --runtime=static
          npm run check:theme-sync
      - name: Build and verify the Django handbook theme bundle
        working-directory: nextjs
        run: |
          npm run build:theme:handbook
          node scripts/with-theme.mjs handbook -- npm run build -- --runtime=static
          npm run check:theme-sync:handbook

  docker:
    # Builds the image the CD workflow publishes (without pushing) and smoke-tests it, so a broken
    # Dockerfile is caught on the pull request instead of after the merge.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gnu-jango:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        # Use an explicit disposable in-memory backend: GeneratedField checks inspect backend
        # capabilities, so an unnamed PostgreSQL connection is no longer a valid smoke fixture.
        # PostgreSQL migrations and behavior are covered by the django job above.
        run: |
          docker run -d --name web -e SECRET_KEY="$(openssl rand -hex 32)" -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:///:memory: -e DB_SSL_REQUIRE=False \
            -e EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend -e RUN_MIGRATIONS=0 gnu-jango:ci
          docker exec web sh -c 'test "$(id -u)" != 0 && touch /app/media/.write-test /app/logs/.write-test'
          docker exec web python manage.py check
          for i in $(seq 1 20); do
            docker exec web python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 3)" && exit 0
            sleep 2
          done
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs web || true
