name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  django:
    # CI runs in the public repository only; a private copy of the code skips it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gnu_jango_ci
          POSTGRES_USER: gnu_jango
          POSTGRES_PASSWORD: gnu_jango_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U gnu_jango -d gnu_jango_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: example.settings
      SECRET_KEY: ci-secret-key
      ENVIRONMENT: Development
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: gnu_jango_ci
      DB_USERNAME: gnu_jango
      DB_PASSWORD: gnu_jango_password
      DB_HOSTNAME: localhost
      DB_PORT: 5432
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Python quality smoke
        # F601 catches duplicate dict keys (one silently overwrote a computed
        # editor flag), F811 redefinitions, E722 bare excepts.
        run: ruff check gnu_jango example --select E9,F63,F7,F82,F601,F811,E722
      - name: Django checks
        run: python manage.py check
      - name: Django tests
        # The whole suite: new test modules are picked up without editing this file.
        # --parallel runs the suite in worker processes (about 4x faster); coverage writes one data
        # file per worker (parallel = true in pyproject.toml) and combine merges them.
        run: |
          coverage run manage.py test gnu_jango --parallel auto
          coverage combine
          coverage report

  nextjs:
    # CI runs in the public repository only; a private copy of the code skips it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Payment return tests
        run: npm run test:payment:return

  docker:
    # Builds the image the CD workflow publishes (without pushing) and smoke-tests it, so a broken
    # Dockerfile is caught on the pull request instead of after the merge.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gnu-jango:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        # No database here: skip migrations; Django setup and gunicorn start without connecting.
        run: |
          docker run -d --name web -e SECRET_KEY="$(openssl rand -hex 32)" -e ALLOWED_HOSTS=localhost \
            -e EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend -e RUN_MIGRATIONS=0 gnu-jango:ci
          docker exec web sh -c 'test "$(id -u)" != 0 && touch /app/media/.write-test /app/logs/.write-test'
          docker exec web python manage.py check
          for i in $(seq 1 20); do
            docker exec web python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 3)" && exit 0
            sleep 2
          done
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs web || true
