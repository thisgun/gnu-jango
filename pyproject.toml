[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | \.venv314
  | build
  | dist
  | staticfiles
  | media
  | gnu_jango/templates/theme/nextjs25
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", ".venv314", "build", "dist", "staticfiles", "media", "gnu_jango/templates/theme/nextjs25"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  ".venv314",
  "build",
  "dist",
  "staticfiles",
  "media",
  "gnu_jango/templates/theme/nextjs25",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
  "\\.venv",
  "\\.venv314",
  "build",
  "dist",
  "staticfiles",
  "media",
  "gnu_jango/templates/theme/nextjs25",
]

[tool.django-stubs]
django_settings_module = "example.settings"

[tool.pytest.ini_options]
# pytest runs the whole suite (CI: pytest -n auto --cov). Django TestCase classes run unchanged;
# new tests may be plain functions using the fixtures in conftest.py and the factories in
# gnu_jango/testing/factories.py.
DJANGO_SETTINGS_MODULE = "example.settings"
testpaths = ["gnu_jango"]
python_files = ["tests.py", "test_*.py"]
addopts = "-p no:cacheprovider --strict-markers"

[tool.coverage.run]
source = ["gnu_jango"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py", "gnu_jango/templates/*"]
branch = true
# pytest-xdist workers each write a data file; pytest-cov combines them and reports.
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
skip_empty = true
# CI (pytest --cov) fails below this. Measured 79.60% on 2026-10-29 (SQLite); kept a point lower
# for the branches PostgreSQL takes differently. Raise it as coverage improves.
fail_under = 78
show_missing = false
