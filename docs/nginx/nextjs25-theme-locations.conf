# Static locations for the G5 Next.js 25 theme.
# Include inside your site's server {} block before generic Gnuboard locations.

location ^~ /theme/nextjs25/_next/static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/g5-nextjs25-security-headers.conf;
}

location ^~ /theme/nextjs25/assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/g5-nextjs25-security-headers.conf;
}

location ~* ^/theme/nextjs25/(favicon\.ico|icon-[0-9]+\.png|apple-icon\.png|manifest\.json|robots\.txt|sitemap\.xml|sw\.js)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/g5-nextjs25-security-headers.conf;
}

location ~* ^/theme/nextjs25/.*\.(?:css|js|mjs|json|map|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/snippets/g5-nextjs25-security-headers.conf;
}

