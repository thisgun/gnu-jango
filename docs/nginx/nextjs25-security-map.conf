# G5 Next.js 25 security policy maps.
# Include this file once inside the nginx http {} block.

map $request_uri $g5_nextjs25_content_security_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.tosspayments.com https://*.tosspayments.com https://testpay.kcp.co.kr https://*.kcp.co.kr https://stdpay.inicis.com https://stgstdpay.inicis.com https://*.inicis.com https://web.nicepay.co.kr https://*.nicepay.co.kr https://t1.daumcdn.net http://t1.daumcdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https: https://t1.daumcdn.net http://t1.daumcdn.net https://t1.kakaocdn.net; font-src 'self' data:; connect-src 'self' https:; frame-src https://*.tosspayments.com https://testpay.kcp.co.kr https://*.kcp.co.kr https://stdpay.inicis.com https://stgstdpay.inicis.com https://*.inicis.com https://web.nicepay.co.kr https://*.nicepay.co.kr https://postcode.map.daum.net https://postcode.map.kakao.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.tosspayments.com https://testpay.kcp.co.kr https://*.kcp.co.kr https://stdpay.inicis.com https://stgstdpay.inicis.com https://*.inicis.com https://web.nicepay.co.kr https://*.nicepay.co.kr; object-src 'none'";
}

map $request_uri $g5_nextjs25_api_content_security_policy {
    default "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
}

